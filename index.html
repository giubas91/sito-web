
<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omaggio Digitale | Giuseppe Basile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script>
      // Prevent FOUC: Sync theme before initial paint
      (function() {
        const storedTheme = localStorage.getItem('ora-theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (storedTheme === 'dark' || (!storedTheme && systemPrefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <style>
      :root {
        --color-gold: #D4AF37;
        --color-gold-rgb: 212, 175, 55;
        
        /* Light Theme Tokens */
        --color-bg: #FFFFFF;
        --color-surface: #F9F9F9;
        --color-text: #111827;
        --color-text-dim: rgba(17, 24, 39, 0.6);
        --color-border: rgba(17, 24, 39, 0.08);
        --color-shadow: rgba(0, 0, 0, 0.1);
      }

      .dark {
        /* Dark Theme Tokens */
        --color-bg: #030303;
        --color-surface: #0A0A0A;
        --color-text: #F3F4F6;
        --color-text-dim: rgba(243, 244, 246, 0.6);
        --color-border: rgba(243, 244, 246, 0.08);
        --color-shadow: rgba(0, 0, 0, 0.8);
      }

      body {
        font-family: 'Lora', serif;
        -webkit-font-smoothing: antialiased;
        background-color: var(--color-bg);
        color: var(--color-text);
        transition: background-color 0.5s ease-in-out, color 0.5s ease-in-out;
      }

      h1, h2, h3, h4, .font-serif-display {
        font-family: 'Cormorant Garamond', serif;
      }

      ::selection {
        background: var(--color-gold);
        color: black;
      }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-up {
        animation: fade-up 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
      }

      /* Hero Transition Optimization */
      .hero-element {
        opacity: 0;
        transform: translate3d(0, 30px, 0);
        will-change: transform, opacity;
        transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1), opacity 1.2s cubic-bezier(0.19, 1, 0.22, 1);
      }

      .hero-element.is-visible {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      html {
        scroll-behavior: smooth;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",

    "jszip": "https://esm.sh/jszip@3.10.1",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>

</html>
